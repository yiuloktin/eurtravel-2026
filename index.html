                references: [{ title: "Tallinn Day Trip 國家公園行程", url: "https://tallinndaytrip.com/tours/day-trip-to-lahemaa-national-park/" }]
            },
            {
                day: 72,
                date: "2026-11-11",
                displayDate: "11 Nov 2026",
                country: "Estonia",
                countryZh: "愛沙尼亞 ➔ 香港",
                flag: "🇪🇪",
                city: "塔林 Tallinn ➔ 返回香港",
                weather: { temp: "-2°C - 2°C", sunrise: "07:54", sunset: "16:02" },
                attractions: [
                    { name: "塔林倫納特·梅里機場 (TLL)", note: "辦理登機與退稅" },
                    { name: "搭乘返港航班", note: "結束 72 天精彩 European Odyssey！" }
                ],
                transport: {
                    type: "Flight",
                    schedule: "根據機票班次",
                    operator: "Homeward Flight",
                    fromName: "Tallinn Airport",
                    fromQuery: "Tallinn Airport",
                    toName: "Hong Kong International Airport",
                    toQuery: "Hong Kong Airport"
                },
                accommodation: null,
                references: []
            }
        ];

        let currentCountry = "All";
        let searchQuery = "";
        let viewMode = "card"; // 'card' or 'timeline'
        let bookmarks = JSON.parse(localStorage.getItem("euro2026_bookmarks") || "[]");
        let completedDays = JSON.parse(localStorage.getItem("euro2026_completed") || "[]");
        let showBookmarksOnly = false;

        // Extract list of unique countries
        const countriesList = [
            { id: "All", name: "全部國家 All", flag: "🌍" },
            { id: "Greece", name: "希臘 Greece", flag: "🇬🇷" },
            { id: "Albania", name: "阿爾巴尼亞 Albania", flag: "🇦🇱" },
            { id: "North Macedonia", name: "北馬其頓 Macedonia", flag: "🇲🇰" },
            { id: "Kosovo", name: "科索沃 Kosovo", flag: "🇽🇰" },
            { id: "Montenegro", name: "黑山 Montenegro", flag: "🇲🇪" },
            { id: "Croatia", name: "克羅地亞 Croatia", flag: "🇭🇷" },
            { id: "Bosnia and Herzegovina", name: "波斯尼亞 Bosnia", flag: "🇧🇦" },
            { id: "Slovenia", name: "斯洛文尼亞 Slovenia", flag: "🇸🇮" },
            { id: "Austria", name: "奧地利 Austria", flag: "🇦🇹" },
            { id: "Hungary", name: "匈牙利 Hungary", flag: "🇭🇺" },
            { id: "Slovakia", name: "斯洛伐克 Slovakia", flag: "🇸🇰" },
            { id: "Czech Republic", name: "捷克 Czechia", flag: "🇨🇿" },
            { id: "Poland", name: "波蘭 Poland", flag: "🇵🇱" },
            { id: "Lithuania", name: "立陶宛 Lithuania", flag: "🇱🇹" },
            { id: "Latvia", name: "拉脫維亞 Latvia", flag: "🇱🇻" },
            { id: "Estonia", name: "愛沙尼亞 Estonia", flag: "🇪🇪" }
        ];

        function getMapsUrl(query) {
            return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
        }

        document.addEventListener("DOMContentLoaded", () => {
            initCountryTabs();
            renderItinerary();
            setupSearchListener();
            updateBookmarkBadge();

            // Auto set dark mode based on time or preference
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });

        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        }

        function initCountryTabs() {
            const container = document.getElementById("countryTabsContainer");
            container.innerHTML = countriesList.map(c => `
                <button onclick="filterByCountry('${c.id}')" id="tab-${c.id.replace(/\s+/g, '')}"
                    class="country-tab px-3 py-1.5 rounded-xl font-medium whitespace-nowrap transition-all border border-slate-200 dark:border-slate-800 flex items-center gap-1.5 ${
                        currentCountry === c.id 
                        ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' 
                        : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700'
                    }">
                    <span>${c.flag}</span>
                    <span>${c.name}</span>
                </button>
            `).join("");
        }

        function filterByCountry(countryId) {
            currentCountry = countryId;
            showBookmarksOnly = false;
            document.querySelectorAll('.country-tab').forEach(btn => {
                btn.className = btn.className.replace('bg-emerald-600 text-white border-emerald-600 shadow-sm', 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700');
            });
            const selectedTab = document.getElementById(`tab-${countryId.replace(/\s+/g, '')}`);
            if(selectedTab) {
                selectedTab.className = selectedTab.className.replace('bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700', 'bg-emerald-600 text-white border-emerald-600 shadow-sm');
                selectedTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
            renderItinerary();
        }

        function setupSearchListener() {
            const input = document.getElementById("searchInput");
            const clearBtn = document.getElementById("clearSearchBtn");

            input.addEventListener("input", (e) => {
                searchQuery = e.target.value.trim().toLowerCase();
                if(searchQuery.length > 0) {
                    clearBtn.classList.remove("hidden");
                } else {
                    clearBtn.classList.add("hidden");
                }
                renderItinerary();
            });
        }

        function clearSearch() {
            document.getElementById("searchInput").value = "";
            searchQuery = "";
            document.getElementById("clearSearchBtn").classList.add("hidden");
            renderItinerary();
        }

        function resetFilters() {
            currentCountry = "All";
            searchQuery = "";
            showBookmarksOnly = false;
            document.getElementById("searchInput").value = "";
            document.getElementById("clearSearchBtn").classList.add("hidden");
            initCountryTabs();
            renderItinerary();
        }

        function toggleBookmarksFilter() {
            showBookmarksOnly = !showBookmarksOnly;
            const btn = document.getElementById("bookmarkFilterBtn");
            if (showBookmarksOnly) {
                btn.classList.add("bg-rose-100", "dark:bg-rose-950/80", "text-rose-600");
            } else {
                btn.classList.remove("bg-rose-100", "dark:bg-rose-950/80", "text-rose-600");
            }
            renderItinerary();
        }

        function toggleBookmark(dayNum, e) {
            if(e) e.stopPropagation();
            if (bookmarks.includes(dayNum)) {
                bookmarks = bookmarks.filter(d => d !== dayNum);
            } else {
                bookmarks.push(dayNum);
            }
            localStorage.setItem("euro2026_bookmarks", JSON.stringify(bookmarks));
            updateBookmarkBadge();
            renderItinerary();
        }

        function toggleComplete(dayNum, e) {
            if(e) e.stopPropagation();
            if (completedDays.includes(dayNum)) {
                completedDays = completedDays.filter(d => d !== dayNum);
            } else {
                completedDays.push(dayNum);
            }
            localStorage.setItem("euro2026_completed", JSON.stringify(completedDays));
            renderItinerary();
        }

        function updateBookmarkBadge() {
            const badge = document.getElementById("bookmarkCountBadge");
            if (bookmarks.length > 0) {
                badge.innerText = bookmarks.length;
                badge.classList.remove("hidden");
            } else {
                badge.classList.add("hidden");
            }
        }

        function setViewMode(mode) {
            viewMode = mode;
            const btnCard = document.getElementById("btnViewCards");
            const btnTimeline = document.getElementById("btnViewTimeline");
            
            if(mode === 'card') {
                btnCard.className = "px-2.5 py-1 text-xs font-medium rounded-md bg-white dark:bg-slate-700 shadow-sm text-emerald-600 dark:text-emerald-400 transition";
                btnTimeline.className = "px-2.5 py-1 text-xs font-medium rounded-md text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition";
            } else {
                btnTimeline.className = "px-2.5 py-1 text-xs font-medium rounded-md bg-white dark:bg-slate-700 shadow-sm text-emerald-600 dark:text-emerald-400 transition";
                btnCard.className = "px-2.5 py-1 text-xs font-medium rounded-md text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition";
            }
            renderItinerary();
        }

        function renderItinerary() {
            const container = document.getElementById("itineraryContainer");
            const emptyState = document.getElementById("emptyResultState");
            const filterText = document.getElementById("filterCurrentText");
            const filterBadge = document.getElementById("filterCountBadge");

            // Filter logic
            let filtered = itineraryData.filter(item => {
                const matchesCountry = (currentCountry === "All") || (item.country === currentCountry);
                const matchesBookmarks = !showBookmarksOnly || bookmarks.includes(item.day);
                
                let matchesSearch = true;
                if (searchQuery) {
                    const fullString = [
                        `day ${item.day}`,
                        item.date,
                        item.displayDate,
                        item.country,
                        item.countryZh,
                        item.city,
                        item.accommodation ? item.accommodation.name : '',
                        item.transport ? `${item.transport.fromName} ${item.transport.toName} ${item.transport.operator}` : '',
                        ...item.attractions.map(a => `${a.name} ${a.note}`)
                    ].join(" ").toLowerCase();
                    matchesSearch = fullString.includes(searchQuery);
                }

                return matchesCountry && matchesBookmarks && matchesSearch;
            });

            // Update status text
            let currentTextStr = "";
            if (showBookmarksOnly) currentTextStr += "[收藏天數] ";
            if (currentCountry !== "All") {
                const cObj = countriesList.find(c => c.id === currentCountry);
                currentTextStr += `${cObj ? cObj.name : currentCountry} `;
            } else {
                currentTextStr += "全行程 ";
            }
            if (searchQuery) currentTextStr += `(關鍵字: "${searchQuery}")`;

            filterText.innerText = currentTextStr;
            filterBadge.innerText = `${filtered.length} 天`;

            if (filtered.length === 0) {
                container.innerHTML = "";
                emptyState.classList.remove("hidden");
                return;
            } else {
                emptyState.classList.add("hidden");
            }

            // View rendering switch
            if (viewMode === 'card') {
                container.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5";
                container.innerHTML = filtered.map(item => renderCardHtml(item)).join("");
            } else {
                container.className = "flex flex-col gap-4 max-w-4xl mx-auto";
                container.innerHTML = filtered.map(item => renderTimelineHtml(item)).join("");
            }
        }

        function renderCardHtml(item) {
            const isBookmarked = bookmarks.includes(item.day);
            const isCompleted = completedDays.includes(item.day);

            return `
            <div class="bg-white dark:bg-slate-800 rounded-3xl border ${isCompleted ? 'border-emerald-400 dark:border-emerald-600/80' : 'border-slate-200/90 dark:border-slate-700/80'} shadow-sm hover:shadow-md transition-all duration-200 flex flex-col justify-between overflow-hidden group">
                
                <div>
                    <!-- Card Top Header -->
                    <div class="p-4 pb-3 bg-slate-50/80 dark:bg-slate-800/50 border-b border-slate-100 dark:border-slate-700/50 flex items-start justify-between">
                        <div class="flex items-center gap-2.5">
                            <span class="w-8 h-8 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-black flex items-center justify-center shadow-sm">
                                D${item.day}
                            </span>
                            <div>
                                <div class="text-[11px] font-semibold text-slate-400 dark:text-slate-400 uppercase tracking-wider flex items-center gap-1">
                                    <span>${item.flag} ${item.countryZh}</span>
                                    <span>•</span>
                                    <span>${item.displayDate}</span>
                                </div>
                                <h3 class="text-base font-bold text-slate-900 dark:text-white leading-snug">
                                    ${item.city}
                                </h3>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="flex items-center gap-1">
                            <button onclick="toggleBookmark(${item.day}, event)" title="收藏" class="p-1.5 rounded-lg hover:bg-slate-200/60 dark:hover:bg-slate-700 transition text-slate-400 hover:text-rose-500">
                                <i class="fa-${isBookmarked ? 'solid text-rose-500' : 'regular'} fa-heart text-sm"></i>
                            </button>
                            <button onclick="toggleComplete(${item.day}, event)" title="${isCompleted ? '標示為未完成' : '標示為已完成'}" class="p-1.5 rounded-lg hover:bg-slate-200/60 dark:hover:bg-slate-700 transition text-slate-400">
                                <i class="fa-${isCompleted ? 'solid text-emerald-500' : 'regular'} fa-circle-check text-sm"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Weather Info Bar -->
                    <div class="px-4 py-2 bg-amber-50/50 dark:bg-amber-950/20 border-b border-amber-100/50 dark:border-amber-900/20 flex items-center justify-between text-[11px] text-amber-900 dark:text-amber-300">
                        <div class="flex items-center gap-1 font-medium">
                            <i class="fa-solid fa-temperature-half text-amber-500"></i>
                            <span>${item.weather.temp}</span>
                        </div>
                        <div class="flex items-center gap-3 text-slate-500 dark:text-slate-400">
                            <span><i class="fa-regular fa-sun text-amber-500 mr-1"></i>${item.weather.sunrise}</span>
                            <span><i class="fa-solid fa-moon text-indigo-400 mr-1"></i>${item.weather.sunset}</span>
                        </div>
                    </div>

                    <!-- Daily Attractions Section -->
                    <div class="p-4 space-y-2.5">
                        <div class="text-[11px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider flex items-center gap-1">
                            <i class="fa-solid fa-map-pin text-emerald-500"></i> 今日景點地圖
                        </div>
                        <ul class="space-y-1.5">
                            ${item.attractions.map(att => `
                                <li class="text-xs group/item">
                                    <a href="${getMapsUrl(att.name + ' ' + item.city)}" target="_blank" rel="noopener" 
                                       class="inline-flex items-start gap-1.5 text-slate-700 dark:text-slate-200 hover:text-emerald-600 dark:hover:text-emerald-400 transition font-medium">
                                        <i class="fa-solid fa-arrow-up-right-from-square text-[10px] text-slate-400 group-hover/item:text-emerald-500 mt-1 shrink-0"></i>
                                        <span>${att.name}</span>
                                    </a>
                                    ${att.note ? `<span class="block text-[11px] text-slate-400 dark:text-slate-500 pl-4">${att.note}</span>` : ''}
                                </li>
                            `).join('')}
                        </ul>
                    </div>

                    <!-- Transit Card (If Any) -->
                    ${item.transport ? `
                    <div class="mx-4 mb-3 p-3 rounded-2xl bg-slate-50 dark:bg-slate-700/40 border border-slate-200/70 dark:border-slate-700/70 text-xs">
                        <div class="flex items-center justify-between mb-1.5">
                            <span class="inline-flex items-center gap-1 font-bold text-blue-600 dark:text-blue-400 text-[11px]">
                                <i class="fa-solid ${item.transport.type === 'Flight' ? 'fa-plane' : item.transport.type === 'Train' ? 'fa-train' : 'fa-bus'}"></i>
                                ${item.transport.operator}
                            </span>
                            <span class="bg-blue-100 dark:bg-blue-950 text-blue-800 dark:text-blue-300 px-2 py-0.5 rounded-full text-[10px] font-bold">
                                ${item.transport.schedule}
                            </span>
                        </div>
                        <div class="space-y-1 text-[11px] text-slate-600 dark:text-slate-300">
                            <div class="flex items-center justify-between">
                                <span class="text-slate-400">上車點:</span>
                                <a href="${getMapsUrl(item.transport.fromQuery)}" target="_blank" class="hover:underline font-medium text-emerald-600 dark:text-emerald-400 flex items-center gap-1">
                                    ${item.transport.fromName} <i class="fa-solid fa-location-dot text-[10px]"></i>
                                </a>
                            </div>
                            <div class="flex items-center justify-between">
                                <span class="text-slate-400">下車點:</span>
                                <a href="${getMapsUrl(item.transport.toQuery)}" target="_blank" class="hover:underline font-medium text-emerald-600 dark:text-emerald-400 flex items-center gap-1">
                                    ${item.transport.toName} <i class="fa-solid fa-location-dot text-[10px]"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                    ` : ''}

                    <!-- Reference Links (If Any) -->
                    ${item.references && item.references.length > 0 ? `
                    <div class="px-4 mb-3 space-y-1">
                        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">參考連結</div>
                        <div class="flex flex-wrap gap-1.5">
                            ${item.references.map(ref => `
                                <a href="${ref.url}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-[11px] bg-slate-100 dark:bg-slate-700/60 hover:bg-slate-200 text-slate-600 dark:text-slate-300 px-2 py-1 rounded-lg transition">
                                    <i class="fa-solid fa-link text-[9px] text-slate-400"></i>
                                    <span>${ref.title}</span>
                                </a>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}
                </div>

                <!-- Footer Accommodation Section -->
                <div class="p-3 bg-slate-50 dark:bg-slate-800/80 border-t border-slate-100 dark:border-slate-700/60 text-xs flex items-center justify-between">
                    <span class="text-slate-400 text-[11px] font-medium flex items-center gap-1">
                        <i class="fa-solid fa-bed text-purple-500"></i> 住宿:
                    </span>
                    ${item.accommodation ? `
                        <a href="${getMapsUrl(item.accommodation.query)}" target="_blank" rel="noopener" 
                           class="font-bold text-purple-700 dark:text-purple-300 hover:underline flex items-center gap-1 truncate max-w-[200px]">
                            <span class="truncate">${item.accommodation.name}</span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-[10px] shrink-0"></i>
                        </a>
                    ` : `
                        <span class="text-slate-400 italic">行程結束/搭機</span>
                    `}
                </div>

            </div>
            `;
        }

        function renderTimelineHtml(item) {
            const isBookmarked = bookmarks.includes(item.day);
            const isCompleted = completedDays.includes(item.day);

            return `
            <div class="relative pl-6 pb-2 border-l-2 ${isCompleted ? 'border-emerald-500' : 'border-slate-200 dark:border-slate-700'}">
                <div class="absolute -left-[9px] top-1 w-4 h-4 rounded-full ${isCompleted ? 'bg-emerald-500' : 'bg-slate-400 dark:bg-slate-600'} border-2 border-white dark:border-slate-900"></div>
                
                <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 p-4 shadow-sm">
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                        <div class="flex items-center gap-2">
                            <span class="px-2 py-0.5 rounded-md bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-black">D${item.day}</span>
                            <span class="text-xs font-bold text-slate-500">${item.displayDate}</span>
                            <span class="text-xs">${item.flag} ${item.countryZh}</span>
                        </div>
                        <div class="flex items-center gap-3 text-xs text-slate-400">
                            <span><i class="fa-solid fa-temperature-half text-amber-500"></i> ${item.weather.temp}</span>
                            <button onclick="toggleBookmark(${item.day}, event)"><i class="fa-${isBookmarked ? 'solid text-rose-500' : 'regular'} fa-heart"></i></button>
                        </div>
                    </div>

                    <h4 class="text-base font-bold text-slate-900 dark:text-white mb-2">${item.city}</h4>

                    <div class="space-y-1.5 text-xs text-slate-700 dark:text-slate-300">
                        ${item.attractions.map(att => `
                            <div>
                                <a href="${getMapsUrl(att.name + ' ' + item.city)}" target="_blank" class="hover:underline font-medium text-emerald-600 dark:text-emerald-400">
                                    • ${att.name}
                                </a>
                                ${att.note ? `<span class="text-slate-400 dark:text-slate-500 text-[11px]"> (${att.note})</span>` : ''}
                            </div>
                        `).join('')}
                    </div>

                    ${item.accommodation ? `
                        <div class="mt-3 pt-2 border-t border-slate-100 dark:border-slate-700/60 text-xs text-purple-600 dark:text-purple-400">
                            <i class="fa-solid fa-bed mr-1"></i>住宿: 
                            <a href="${getMapsUrl(item.accommodation.query)}" target="_blank" class="font-bold hover:underline">
                                ${item.accommodation.name}
                            </a>
                        </div>
                    ` : ''}
                </div>
            </div>
            `;
        }

        function scrollToToday() {
            // Find day closest to today or scroll to day 1
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
